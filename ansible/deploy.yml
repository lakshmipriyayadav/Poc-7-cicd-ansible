---
- hosts: web
  become: true

  tasks:

    - name: Stop old container
      shell: docker stop flask-container || true

    - name: Remove old container
      shell: docker rm flask-container || true

    - name: Remove old image
      shell: docker rmi flask-image || true

    - name: Run container
      shell: docker run -d -p 5000:5000 --name flask-container flask-image