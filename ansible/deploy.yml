---
- hosts: web
  become: true

  tasks:

    - name: Copy docker image tar file
      copy:
        src: /home/ubuntu/flask-image.tar
        dest: /home/ubuntu/flask-image.tar

    - name: Load Docker image
      shell: docker load -i /home/ubuntu/flask-image.tar

    - name: Stop old container
      shell: docker stop flask-container || true

    - name: Remove old container
      shell: docker rm flask-container || true

    - name: Run container
      shell: docker run -d -p 5000:5000 --name flask-container flask-image
